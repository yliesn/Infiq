<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paramètres — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="nav-placeholder"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold">Paramètres société</h4>
      <button class="btn btn-primary" id="btn-save">
        <i class="bi bi-floppy me-1"></i>Enregistrer
      </button>
    </div>

    <div id="alert-box" class="alert d-none"></div>

    <div class="row g-4">
      <!-- Identité -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">Identité</h6>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Raison sociale *</label>
              <input type="text" id="f-name" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">SIRET</label>
              <input type="text" id="f-siret" class="form-control" maxlength="14">
            </div>
            <div class="mb-3">
              <label class="form-label">N° TVA intracommunautaire</label>
              <input type="text" id="f-vat-number" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Régime TVA</label>
              <select id="f-vat-regime" class="form-select">
                <option value="franchise">Franchise en base (non assujetti TVA)</option>
                <option value="normal">Régime normal (TVA collectée)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Adresse -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">Adresse</h6>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Adresse ligne 1</label>
              <input type="text" id="f-addr1" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Adresse ligne 2</label>
              <input type="text" id="f-addr2" class="form-control">
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label class="form-label">Code postal</label>
                <input type="text" id="f-postal" class="form-control">
              </div>
              <div class="col-5">
                <label class="form-label">Ville</label>
                <input type="text" id="f-city" class="form-control">
              </div>
              <div class="col-3">
                <label class="form-label">Pays</label>
                <input type="text" id="f-country" class="form-control" value="France">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Paiement -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">Paiement</h6>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">IBAN</label>
              <input type="text" id="f-iban" class="form-control" placeholder="FR76 …">
            </div>
            <div class="mb-3">
              <label class="form-label">Conditions de paiement par défaut</label>
              <textarea id="f-payment-terms" class="form-control" rows="3"
                placeholder="Ex : Paiement à 30 jours fin de mois"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Numérotation & pied de page -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">Numérotation & mentions légales</h6>
          </div>
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Préfixe devis</label>
                <input type="text" id="f-quote-prefix" class="form-control" placeholder="DEV">
                <div class="form-text">Ex : DEV → DEV-2025-001</div>
              </div>
              <div class="col-6">
                <label class="form-label">Préfixe facture</label>
                <input type="text" id="f-invoice-prefix" class="form-control" placeholder="FAC">
                <div class="form-text">Ex : FAC → FAC-2025-001</div>
              </div>
            </div>
            <div>
              <label class="form-label">Mentions légales (pied de document)</label>
              <textarea id="f-legal-footer" class="form-control" rows="4"
                placeholder="TVA non applicable, art. 293 B du CGI…"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  initLayout('settings');

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('btn-save').addEventListener('click', save);
    try {
      const s = await apiFetch('/settings.php');
      document.getElementById('f-name').value           = s.name            || '';
      document.getElementById('f-siret').value          = s.siret           || '';
      document.getElementById('f-vat-number').value     = s.vat_number      || '';
      document.getElementById('f-vat-regime').value     = s.vat_regime      || 'franchise';
      document.getElementById('f-addr1').value          = s.address_line1   || '';
      document.getElementById('f-addr2').value          = s.address_line2   || '';
      document.getElementById('f-postal').value         = s.postal_code     || '';
      document.getElementById('f-city').value           = s.city            || '';
      document.getElementById('f-country').value        = s.country         || 'France';
      document.getElementById('f-iban').value           = s.iban            || '';
      document.getElementById('f-payment-terms').value  = s.payment_terms   || '';
      document.getElementById('f-quote-prefix').value   = s.quote_prefix    || 'DEV';
      document.getElementById('f-invoice-prefix').value = s.invoice_prefix  || 'FAC';
      document.getElementById('f-legal-footer').value   = s.legal_footer    || '';
    } catch (e) {
      showAlert(e.message, 'danger');
    }
  });

  async function save() {
    const body = {
      name:           document.getElementById('f-name').value.trim(),
      siret:          document.getElementById('f-siret').value.trim()          || null,
      vat_number:     document.getElementById('f-vat-number').value.trim()     || null,
      vat_regime:     document.getElementById('f-vat-regime').value,
      address_line1:  document.getElementById('f-addr1').value.trim()          || null,
      address_line2:  document.getElementById('f-addr2').value.trim()          || null,
      postal_code:    document.getElementById('f-postal').value.trim()         || null,
      city:           document.getElementById('f-city').value.trim()           || null,
      country:        document.getElementById('f-country').value.trim()        || 'France',
      iban:           document.getElementById('f-iban').value.trim()           || null,
      payment_terms:  document.getElementById('f-payment-terms').value.trim()  || null,
      quote_prefix:   document.getElementById('f-quote-prefix').value.trim()   || 'DEV',
      invoice_prefix: document.getElementById('f-invoice-prefix').value.trim() || 'FAC',
      legal_footer:   document.getElementById('f-legal-footer').value.trim()   || null,
    };

    try {
      await apiFetch('/settings.php', { method: 'PUT', body: JSON.stringify(body) });
      showAlert('Paramètres enregistrés.', 'success');
    } catch (e) {
      showAlert(e.message, 'danger');
    }
  }

  function showAlert(msg, type = 'success') {
    const el = document.getElementById('alert-box');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    setTimeout(() => el.classList.add('d-none'), 4000);
  }
</script>

</body>
</html>
