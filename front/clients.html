<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .offcanvas-end { width: 480px; }
    .fiche-dl dt  { font-size: .8rem; color: #6c757d; font-weight: 500; }
    .fiche-dl dd  { font-size: .9rem; margin-bottom: .4rem; }
  </style>
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="nav-placeholder"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold">Clients</h4>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="bi bi-plus-lg me-1"></i>Nouveau client
      </button>
    </div>

    <!-- Filtres -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body py-2">
        <div class="d-flex gap-2 align-items-center">
          <input type="search" id="search" class="form-control form-control-sm" placeholder="Rechercher…" style="max-width:280px">
          <div class="form-check form-switch ms-2 mb-0">
            <input class="form-check-input" type="checkbox" id="show-inactive">
            <label class="form-check-label small" for="show-inactive">Afficher inactifs</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Nom / Société</th>
                <th>Type</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Ville</th>
                <th>Statut</th>
                <th class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="clients-table">
              <tr><td colspan="7" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── Offcanvas fiche client ─────────────────────────────────────── -->
<div class="offcanvas offcanvas-end shadow" tabindex="-1" id="ficheOffcanvas">
  <div class="offcanvas-header border-bottom">
    <div>
      <h5 class="offcanvas-title mb-0 fw-bold" id="fiche-name">—</h5>
      <small class="text-muted" id="fiche-meta"></small>
    </div>
    <div class="d-flex align-items-center gap-2 ms-auto me-2">
      <span id="fiche-status-badge"></span>
      <button class="btn btn-sm btn-outline-secondary" id="fiche-btn-edit">
        <i class="bi bi-pencil me-1"></i>Modifier
      </button>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body p-0 overflow-y-auto">

    <!-- Coordonnées -->
    <div class="px-3 pt-3 pb-2">
      <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.7rem;letter-spacing:.06em">Contact</p>
      <dl class="fiche-dl row g-0 mb-0" id="fiche-contact">
        <dd class="col-12 text-muted fst-italic small">—</dd>
      </dl>
    </div>

    <hr class="my-0">

    <!-- Adresse -->
    <div class="px-3 py-2">
      <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.7rem;letter-spacing:.06em">Adresse</p>
      <dl class="fiche-dl row g-0 mb-0" id="fiche-address">
        <dd class="col-12 text-muted fst-italic small">—</dd>
      </dl>
    </div>

    <!-- Légal (pro seulement) -->
    <div id="fiche-legal-section" style="display:none">
      <hr class="my-0">
      <div class="px-3 py-2">
        <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.7rem;letter-spacing:.06em">Informations légales</p>
        <dl class="fiche-dl row g-0 mb-0" id="fiche-legal"></dl>
      </div>
    </div>

    <!-- Notes -->
    <div id="fiche-notes-section" style="display:none">
      <hr class="my-0">
      <div class="px-3 py-2">
        <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.7rem;letter-spacing:.06em">Notes internes</p>
        <p class="small mb-0" id="fiche-notes" style="white-space:pre-wrap"></p>
      </div>
    </div>

    <hr class="my-0">

    <!-- Documents -->
    <div class="px-3 pt-2 pb-1">
      <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.7rem;letter-spacing:.06em">Documents</p>
      <ul class="nav nav-pills nav-fill mb-2" id="fiche-doc-tabs">
        <li class="nav-item"><a class="nav-link active py-1 px-2 small" href="#" data-type="">Tous</a></li>
        <li class="nav-item"><a class="nav-link py-1 px-2 small" href="#" data-type="quote">Devis</a></li>
        <li class="nav-item"><a class="nav-link py-1 px-2 small" href="#" data-type="invoice">Factures</a></li>
      </ul>
    </div>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3">N°</th>
            <th>Date</th>
            <th class="text-end pe-2">TTC</th>
            <th>Statut</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fiche-docs">
          <tr><td colspan="5" class="text-center text-muted py-3 small">—</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- ── Modal création / édition client ────────────────────────────── -->
<div class="modal fade" id="clientModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Nouveau client</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-alert" class="alert alert-danger d-none"></div>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Type *</label>
            <select id="f-type" class="form-select">
              <option value="pro">Professionnel</option>
              <option value="particulier">Particulier</option>
            </select>
          </div>
          <div class="col-md-8" id="company-field">
            <label class="form-label">Raison sociale</label>
            <input type="text" id="f-company" class="form-control" placeholder="ACME SAS">
          </div>
          <div class="col-md-6">
            <label class="form-label">Prénom</label>
            <input type="text" id="f-firstname" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" id="f-lastname" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="f-email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Téléphone</label>
            <input type="tel" id="f-phone" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Adresse ligne 1</label>
            <input type="text" id="f-addr1" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Adresse ligne 2</label>
            <input type="text" id="f-addr2" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Code postal</label>
            <input type="text" id="f-postal" class="form-control">
          </div>
          <div class="col-md-5">
            <label class="form-label">Ville</label>
            <input type="text" id="f-city" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Pays</label>
            <input type="text" id="f-country" class="form-control" value="France">
          </div>
          <div class="col-md-6" id="siret-field">
            <label class="form-label">SIRET</label>
            <input type="text" id="f-siret" class="form-control" maxlength="14">
          </div>
          <div class="col-md-6" id="vat-field">
            <label class="form-label">N° TVA intracommunautaire</label>
            <input type="text" id="f-vat" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Notes internes</label>
            <textarea id="f-notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  initLayout('clients');

  let modal, offcanvas;
  let editId       = null;
  let ficheClient  = null;
  let ficheDocType = '';

  document.addEventListener('DOMContentLoaded', () => {
    modal     = new bootstrap.Modal(document.getElementById('clientModal'));
    offcanvas = new bootstrap.Offcanvas(document.getElementById('ficheOffcanvas'));

    loadClients();

    document.getElementById('search').addEventListener('input', debounce(loadClients, 300));
    document.getElementById('show-inactive').addEventListener('change', loadClients);
    document.getElementById('f-type').addEventListener('change', toggleProFields);
    document.getElementById('btn-save').addEventListener('click', saveClient);
    document.getElementById('fiche-btn-edit').addEventListener('click', () => openModal(ficheClient));

    document.querySelectorAll('#fiche-doc-tabs .nav-link').forEach(tab => {
      tab.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('#fiche-doc-tabs .nav-link').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        ficheDocType = tab.dataset.type;
        loadFicheDocs();
      });
    });
  });

  // ── Liste ──────────────────────────────────────────────────────────

  function toggleProFields() {
    const isPro = document.getElementById('f-type').value === 'pro';
    document.getElementById('company-field').classList.toggle('d-none', !isPro);
    document.getElementById('siret-field').classList.toggle('d-none', !isPro);
    document.getElementById('vat-field').classList.toggle('d-none', !isPro);
  }

  async function loadClients() {
    const q      = document.getElementById('search').value;
    const active = document.getElementById('show-inactive').checked ? '0' : '1';
    const tbody  = document.getElementById('clients-table');

    try {
      const clients = await apiFetch(`/clients.php?active=${active}&q=${encodeURIComponent(q)}`);
      if (!clients.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucun client</td></tr>';
        return;
      }
      tbody.innerHTML = clients.map(c => `
        <tr>
          <td class="ps-3 fw-semibold">${esc(c.company_name || `${c.first_name} ${c.last_name}`.trim())}</td>
          <td><span class="badge bg-light text-dark border">${c.type === 'pro' ? 'Pro' : 'Particulier'}</span></td>
          <td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'}</td>
          <td>${esc(c.phone || '—')}</td>
          <td>${esc(c.city || '—')}</td>
          <td>${c.is_active
            ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Actif</span>'
            : '<span class="badge bg-secondary-subtle text-secondary border">Inactif</span>'}</td>
          <td class="text-end pe-3">
            <a href="client.html?id=${c.id}" class="btn btn-sm btn-outline-secondary me-1" title="Fiche client">
              <i class="bi bi-eye"></i>
            </a>
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="openModal(${JSON.stringify(c).replace(/"/g, '&quot;')})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteClient(${c.id}, '${esc(c.company_name || c.last_name)}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${esc(e.message)}</td></tr>`;
    }
  }

  // ── Fiche (offcanvas) ──────────────────────────────────────────────

  async function openFiche(id) {
    ficheClient  = null;
    ficheDocType = '';
    document.querySelectorAll('#fiche-doc-tabs .nav-link').forEach((t, i) => t.classList.toggle('active', i === 0));
    document.getElementById('fiche-name').textContent = 'Chargement…';
    document.getElementById('fiche-meta').textContent = '';
    document.getElementById('fiche-status-badge').innerHTML = '';
    document.getElementById('fiche-contact').innerHTML  = '<dd class="col-12 text-muted fst-italic small">…</dd>';
    document.getElementById('fiche-address').innerHTML  = '<dd class="col-12 text-muted fst-italic small">…</dd>';
    document.getElementById('fiche-legal-section').style.display = 'none';
    document.getElementById('fiche-notes-section').style.display = 'none';
    document.getElementById('fiche-docs').innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3 small">…</td></tr>';
    offcanvas.show();

    try {
      ficheClient = await apiFetch(`/clients.php?id=${id}`);
      renderFiche();
      loadFicheDocs();
    } catch (e) {
      document.getElementById('fiche-name').textContent = 'Erreur de chargement';
    }
  }

  function renderFiche() {
    const c    = ficheClient;
    const name = c.company_name || `${c.first_name || ''} ${c.last_name || ''}`.trim() || '—';

    document.getElementById('fiche-name').textContent = name;
    document.getElementById('fiche-meta').textContent = c.type === 'pro' ? 'Professionnel' : 'Particulier';
    document.getElementById('fiche-status-badge').innerHTML = c.is_active
      ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Actif</span>'
      : '<span class="badge bg-secondary-subtle text-secondary border">Inactif</span>';

    // Contact
    const contactRows = fiRow('Email', c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : null)
                      + fiRow('Téléphone', c.phone);
    document.getElementById('fiche-contact').innerHTML = contactRows
      || '<dd class="col-12 text-muted fst-italic small">Aucune coordonnée</dd>';

    // Adresse
    const parts = [
      c.address_line1, c.address_line2,
      [c.postal_code, c.city].filter(Boolean).join(' '),
      c.country !== 'France' ? c.country : null,
    ].filter(Boolean);
    document.getElementById('fiche-address').innerHTML = parts.length
      ? `<dd class="col-12 small">${parts.map(esc).join('<br>')}</dd>`
      : '<dd class="col-12 text-muted fst-italic small">Aucune adresse</dd>';

    // Légal
    if (c.type === 'pro' && (c.siret || c.vat_number)) {
      document.getElementById('fiche-legal-section').style.display = '';
      document.getElementById('fiche-legal').innerHTML = fiRow('SIRET', c.siret) + fiRow('TVA intracom.', c.vat_number);
    }

    // Notes
    if (c.notes) {
      document.getElementById('fiche-notes-section').style.display = '';
      document.getElementById('fiche-notes').textContent = c.notes;
    }
  }

  function fiRow(label, value) {
    if (!value) return '';
    return `<dt class="col-5">${label}</dt><dd class="col-7 mb-1">${value}</dd>`;
  }

  async function loadFicheDocs() {
    const tbody = document.getElementById('fiche-docs');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3 small">Chargement…</td></tr>';
    try {
      let url = `/documents.php?client_id=${ficheClient.id}`;
      if (ficheDocType) url += `&type=${ficheDocType}`;
      const docs = await apiFetch(url);
      if (!docs.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3 small">Aucun document</td></tr>';
        return;
      }
      tbody.innerHTML = docs.map(d => `
        <tr>
          <td class="ps-3 small fw-semibold">${esc(d.number || '—')}</td>
          <td class="small">${formatDate(d.issue_date)}</td>
          <td class="text-end pe-2 small">${formatMoney(d.total_ttc)}</td>
          <td>${statusBadge(d.type, d.status)}</td>
          <td class="pe-2">
            <a href="document-editor.html?id=${d.id}" class="btn btn-sm btn-outline-secondary py-0 px-1">
              <i class="bi bi-eye" style="font-size:.75rem"></i>
            </a>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-3 small">${esc(e.message)}</td></tr>`;
    }
  }

  // ── Modal création / édition ───────────────────────────────────────

  function openModal(client = null) {
    editId = client?.id ?? null;
    document.getElementById('modal-title').textContent = editId ? 'Modifier le client' : 'Nouveau client';
    document.getElementById('modal-alert').classList.add('d-none');

    document.getElementById('f-type').value      = client?.type           || 'pro';
    document.getElementById('f-company').value   = client?.company_name   || '';
    document.getElementById('f-firstname').value = client?.first_name     || '';
    document.getElementById('f-lastname').value  = client?.last_name      || '';
    document.getElementById('f-email').value     = client?.email          || '';
    document.getElementById('f-phone').value     = client?.phone          || '';
    document.getElementById('f-addr1').value     = client?.address_line1  || '';
    document.getElementById('f-addr2').value     = client?.address_line2  || '';
    document.getElementById('f-postal').value    = client?.postal_code    || '';
    document.getElementById('f-city').value      = client?.city           || '';
    document.getElementById('f-country').value   = client?.country        || 'France';
    document.getElementById('f-siret').value     = client?.siret          || '';
    document.getElementById('f-vat').value       = client?.vat_number     || '';
    document.getElementById('f-notes').value     = client?.notes          || '';

    toggleProFields();
    modal.show();
  }

  async function saveClient() {
    const body = {
      type:          document.getElementById('f-type').value,
      company_name:  document.getElementById('f-company').value  || null,
      first_name:    document.getElementById('f-firstname').value,
      last_name:     document.getElementById('f-lastname').value,
      email:         document.getElementById('f-email').value    || null,
      phone:         document.getElementById('f-phone').value    || null,
      address_line1: document.getElementById('f-addr1').value    || null,
      address_line2: document.getElementById('f-addr2').value    || null,
      postal_code:   document.getElementById('f-postal').value   || null,
      city:          document.getElementById('f-city').value     || null,
      country:       document.getElementById('f-country').value  || 'France',
      siret:         document.getElementById('f-siret').value    || null,
      vat_number:    document.getElementById('f-vat').value      || null,
      notes:         document.getElementById('f-notes').value    || null,
    };

    const alertEl = document.getElementById('modal-alert');
    alertEl.classList.add('d-none');

    try {
      if (editId) {
        const updated = await apiFetch(`/clients.php?id=${editId}`, { method: 'PUT', body: JSON.stringify(body) });
        toast('Client mis à jour');
        if (ficheClient?.id === editId) {
          ficheClient = updated;
          renderFiche();
        }
      } else {
        await apiFetch('/clients.php', { method: 'POST', body: JSON.stringify(body) });
        toast('Client créé');
      }
      modal.hide();
      loadClients();
    } catch (e) {
      alertEl.textContent = e.message;
      alertEl.classList.remove('d-none');
    }
  }

  async function deleteClient(id, name) {
    if (!await confirmAction(`Supprimer / désactiver « ${name} » ?`)) return;
    try {
      const res = await apiFetch(`/clients.php?id=${id}`, { method: 'DELETE' });
      toast(res.message);
      loadClients();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function debounce(fn, delay) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }
</script>

</body>
</html>
