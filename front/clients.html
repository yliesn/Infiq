<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="nav-placeholder"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold">Clients</h4>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="bi bi-plus-lg me-1"></i>Nouveau client
      </button>
    </div>

    <!-- Filtres -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body py-2">
        <div class="d-flex gap-2 align-items-center">
          <input type="search" id="search" class="form-control form-control-sm" placeholder="Rechercher…" style="max-width:280px">
          <div class="form-check form-switch ms-2 mb-0">
            <input class="form-check-input" type="checkbox" id="show-inactive">
            <label class="form-check-label small" for="show-inactive">Afficher inactifs</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Nom / Société</th>
                <th>Type</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Ville</th>
                <th>Statut</th>
                <th class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="clients-table">
              <tr><td colspan="7" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal client -->
<div class="modal fade" id="clientModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Nouveau client</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-alert" class="alert alert-danger d-none"></div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Type *</label>
            <select id="f-type" class="form-select">
              <option value="pro">Professionnel</option>
              <option value="particulier">Particulier</option>
            </select>
          </div>
          <div class="col-md-8" id="company-field">
            <label class="form-label">Raison sociale</label>
            <input type="text" id="f-company" class="form-control" placeholder="ACME SAS">
          </div>

          <div class="col-md-6">
            <label class="form-label">Prénom</label>
            <input type="text" id="f-firstname" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" id="f-lastname" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="f-email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Téléphone</label>
            <input type="tel" id="f-phone" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label">Adresse ligne 1</label>
            <input type="text" id="f-addr1" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Adresse ligne 2</label>
            <input type="text" id="f-addr2" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Code postal</label>
            <input type="text" id="f-postal" class="form-control">
          </div>
          <div class="col-md-5">
            <label class="form-label">Ville</label>
            <input type="text" id="f-city" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Pays</label>
            <input type="text" id="f-country" class="form-control" value="France">
          </div>

          <div class="col-md-6" id="siret-field">
            <label class="form-label">SIRET</label>
            <input type="text" id="f-siret" class="form-control" maxlength="14">
          </div>
          <div class="col-md-6" id="vat-field">
            <label class="form-label">N° TVA intracommunautaire</label>
            <input type="text" id="f-vat" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label">Notes internes</label>
            <textarea id="f-notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  initLayout('clients');

  let modal, editId = null;

  document.addEventListener('DOMContentLoaded', () => {
    modal = new bootstrap.Modal(document.getElementById('clientModal'));
    loadClients();

    document.getElementById('search').addEventListener('input', debounce(loadClients, 300));
    document.getElementById('show-inactive').addEventListener('change', loadClients);
    document.getElementById('f-type').addEventListener('change', toggleProFields);
    document.getElementById('btn-save').addEventListener('click', saveClient);
  });

  function toggleProFields() {
    const isPro = document.getElementById('f-type').value === 'pro';
    document.getElementById('company-field').classList.toggle('d-none', !isPro);
    document.getElementById('siret-field').classList.toggle('d-none', !isPro);
    document.getElementById('vat-field').classList.toggle('d-none', !isPro);
  }

  async function loadClients() {
    const q      = document.getElementById('search').value;
    const active = document.getElementById('show-inactive').checked ? '0' : '1';
    const tbody  = document.getElementById('clients-table');

    try {
      const clients = await apiFetch(`/clients.php?active=${active}&q=${encodeURIComponent(q)}`);
      if (!clients.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucun client</td></tr>';
        return;
      }
      tbody.innerHTML = clients.map(c => `
        <tr>
          <td class="ps-3 fw-semibold">${esc(c.company_name || `${c.first_name} ${c.last_name}`.trim())}</td>
          <td><span class="badge bg-light text-dark border">${c.type === 'pro' ? 'Pro' : 'Particulier'}</span></td>
          <td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'}</td>
          <td>${esc(c.phone || '—')}</td>
          <td>${esc(c.city || '—')}</td>
          <td>${c.is_active ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Actif</span>' : '<span class="badge bg-secondary-subtle text-secondary border">Inactif</span>'}</td>
          <td class="text-end pe-3">
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="openModal(${JSON.stringify(c).replace(/"/g, '&quot;')})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteClient(${c.id}, '${esc(c.company_name || c.last_name)}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${esc(e.message)}</td></tr>`;
    }
  }

  function openModal(client = null) {
    editId = client?.id ?? null;
    document.getElementById('modal-title').textContent = editId ? 'Modifier le client' : 'Nouveau client';
    document.getElementById('modal-alert').classList.add('d-none');

    document.getElementById('f-type').value      = client?.type      || 'pro';
    document.getElementById('f-company').value   = client?.company_name || '';
    document.getElementById('f-firstname').value = client?.first_name   || '';
    document.getElementById('f-lastname').value  = client?.last_name    || '';
    document.getElementById('f-email').value     = client?.email        || '';
    document.getElementById('f-phone').value     = client?.phone        || '';
    document.getElementById('f-addr1').value     = client?.address_line1 || '';
    document.getElementById('f-addr2').value     = client?.address_line2 || '';
    document.getElementById('f-postal').value    = client?.postal_code   || '';
    document.getElementById('f-city').value      = client?.city          || '';
    document.getElementById('f-country').value   = client?.country       || 'France';
    document.getElementById('f-siret').value     = client?.siret         || '';
    document.getElementById('f-vat').value       = client?.vat_number    || '';
    document.getElementById('f-notes').value     = client?.notes         || '';

    toggleProFields();
    modal.show();
  }

  async function saveClient() {
    const body = {
      type:          document.getElementById('f-type').value,
      company_name:  document.getElementById('f-company').value  || null,
      first_name:    document.getElementById('f-firstname').value,
      last_name:     document.getElementById('f-lastname').value,
      email:         document.getElementById('f-email').value    || null,
      phone:         document.getElementById('f-phone').value    || null,
      address_line1: document.getElementById('f-addr1').value    || null,
      address_line2: document.getElementById('f-addr2').value    || null,
      postal_code:   document.getElementById('f-postal').value   || null,
      city:          document.getElementById('f-city').value     || null,
      country:       document.getElementById('f-country').value  || 'France',
      siret:         document.getElementById('f-siret').value    || null,
      vat_number:    document.getElementById('f-vat').value      || null,
      notes:         document.getElementById('f-notes').value    || null,
    };

    const alertEl = document.getElementById('modal-alert');
    alertEl.classList.add('d-none');

    try {
      if (editId) {
        await apiFetch(`/clients.php?id=${editId}`, { method: 'PUT', body: JSON.stringify(body) });
        toast('Client mis à jour');
      } else {
        await apiFetch('/clients.php', { method: 'POST', body: JSON.stringify(body) });
        toast('Client créé');
      }
      modal.hide();
      loadClients();
    } catch (e) {
      alertEl.textContent = e.message;
      alertEl.classList.remove('d-none');
    }
  }

  async function deleteClient(id, name) {
    if (!await confirmAction(`Supprimer / désactiver « ${name} » ?`)) return;
    try {
      const res = await apiFetch(`/clients.php?id=${id}`, { method: 'DELETE' });
      toast(res.message);
      loadClients();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function debounce(fn, delay) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }
</script>

</body>
</html>
