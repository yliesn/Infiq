<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="nav-placeholder"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold">Services</h4>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="bi bi-plus-lg me-1"></i>Nouveau service
      </button>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Libellé</th>
                <th>Unité</th>
                <th class="text-end">Prix unitaire HT</th>
                <th>TVA</th>
                <th>Statut</th>
                <th class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="services-table">
              <tr><td colspan="6" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal service -->
<div class="modal fade" id="serviceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Nouveau service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-alert" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label class="form-label">Libellé *</label>
          <input type="text" id="f-label" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="f-description" class="form-control" rows="2"></textarea>
        </div>
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Prix unitaire HT (€) *</label>
            <input type="number" id="f-price" class="form-control" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="col-md-4">
            <label class="form-label">TVA</label>
            <select id="f-vat" class="form-select">
              <option value="0">0 %</option>
              <option value="550">5,5 %</option>
              <option value="1000">10 %</option>
              <option value="2000" selected>20 %</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Unité *</label>
            <select id="f-unit" class="form-select">
              <option value="forfait">Forfait</option>
              <option value="heure">Heure</option>
              <option value="jour">Jour</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  initLayout('services');

  let modal, editId = null;

  const UNIT_LABELS = { forfait: 'Forfait', heure: 'Heure', jour: 'Jour' };

  document.addEventListener('DOMContentLoaded', () => {
    modal = new bootstrap.Modal(document.getElementById('serviceModal'));
    document.getElementById('btn-save').addEventListener('click', saveService);
    load();
  });

  async function load() {
    const tbody = document.getElementById('services-table');
    try {
      const list = await apiFetch('/services.php?active=0');
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Aucun service</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(s => `
        <tr>
          <td class="ps-3 fw-semibold">${esc(s.label)}</td>
          <td>${UNIT_LABELS[s.unit] || s.unit}</td>
          <td class="text-end">${formatMoney(s.unit_price)}</td>
          <td>${formatVat(s.vat_rate)}</td>
          <td>${s.is_active
            ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Actif</span>'
            : '<span class="badge bg-secondary-subtle text-secondary border">Inactif</span>'}</td>
          <td class="text-end pe-3">
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="openModal(${JSON.stringify(s).replace(/"/g,'&quot;')})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteService(${s.id}, '${esc(s.label)}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${esc(e.message)}</td></tr>`;
    }
  }

  function openModal(service = null) {
    editId = service?.id ?? null;
    document.getElementById('modal-title').textContent = editId ? 'Modifier le service' : 'Nouveau service';
    document.getElementById('modal-alert').classList.add('d-none');

    document.getElementById('f-label').value       = service?.label       || '';
    document.getElementById('f-description').value = service?.description || '';
    document.getElementById('f-price').value       = service ? (service.unit_price / 100).toFixed(2) : '';
    document.getElementById('f-vat').value         = service?.vat_rate    ?? 2000;
    document.getElementById('f-unit').value        = service?.unit        || 'forfait';

    modal.show();
  }

  async function saveService() {
    const priceEur = parseFloat(document.getElementById('f-price').value);
    const body = {
      label:       document.getElementById('f-label').value.trim(),
      description: document.getElementById('f-description').value || null,
      unit_price:  Math.round(priceEur * 100),
      vat_rate:    parseInt(document.getElementById('f-vat').value),
      unit:        document.getElementById('f-unit').value,
    };

    const alertEl = document.getElementById('modal-alert');
    alertEl.classList.add('d-none');

    try {
      if (editId) {
        await apiFetch(`/services.php?id=${editId}`, { method: 'PUT', body: JSON.stringify(body) });
        toast('Service mis à jour');
      } else {
        await apiFetch('/services.php', { method: 'POST', body: JSON.stringify(body) });
        toast('Service créé');
      }
      modal.hide();
      load();
    } catch (e) {
      alertEl.textContent = e.message;
      alertEl.classList.remove('d-none');
    }
  }

  async function deleteService(id, name) {
    if (!await confirmAction(`Supprimer / désactiver « ${name} » ?`)) return;
    try {
      const res = await apiFetch(`/services.php?id=${id}`, { method: 'DELETE' });
      toast(res.message);
      load();
    } catch (e) {
      toast(e.message, 'error');
    }
  }
</script>

</body>
</html>
