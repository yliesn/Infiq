<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .chart-card canvas { max-height: 260px; }
  </style>
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="nav-placeholder"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold">Dashboard</h4>
      <small class="text-muted" id="today-date"></small>
    </div>

    <!-- KPI cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3">
              <div class="rounded-circle bg-primary bg-opacity-10 p-3">
                <i class="bi bi-people-fill fs-4 text-primary"></i>
              </div>
              <div>
                <div class="fs-2 fw-bold" id="kpi-clients">—</div>
                <div class="text-muted small">Clients actifs</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3">
              <div class="rounded-circle bg-warning bg-opacity-10 p-3">
                <i class="bi bi-file-text fs-4 text-warning"></i>
              </div>
              <div>
                <div class="fs-2 fw-bold" id="kpi-quotes">—</div>
                <div class="text-muted small">Devis en cours</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3">
              <div class="rounded-circle bg-danger bg-opacity-10 p-3">
                <i class="bi bi-receipt fs-4 text-danger"></i>
              </div>
              <div>
                <div class="fs-2 fw-bold" id="kpi-unpaid">—</div>
                <div class="text-muted small">Factures impayées</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3">
              <div class="rounded-circle bg-success bg-opacity-10 p-3">
                <i class="bi bi-cash-stack fs-4 text-success"></i>
              </div>
              <div>
                <div class="fw-bold" id="kpi-revenue-month">—</div>
                <div class="text-muted small" id="kpi-revenue-year-sub">CA ce mois</div>
                <div class="text-muted smaller" id="kpi-revenue-year"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm chart-card h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">CA mensuel (12 derniers mois)</h6>
          </div>
          <div class="card-body">
            <canvas id="chart-revenue"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm chart-card h-100">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h6 class="fw-semibold mb-0">Statuts des factures</h6>
          </div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chart-status"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Documents récents -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 pt-3 pb-0">
        <h6 class="fw-semibold mb-0">Documents récents</h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">N°</th>
                <th>Type</th>
                <th>Client</th>
                <th>Date</th>
                <th class="text-end pe-3">Montant TTC</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody id="recent-table">
              <tr><td colspan="6" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script>
  initLayout('dashboard');

  document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('fr-FR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  apiFetch('/stats.php').then(s => {
    document.getElementById('kpi-clients').textContent   = s.active_clients;
    document.getElementById('kpi-quotes').textContent    = s.pending_quotes;
    document.getElementById('kpi-unpaid').textContent    = s.unpaid_invoices;
    document.getElementById('kpi-revenue-month').textContent = formatMoney(s.revenue_month);
    document.getElementById('kpi-revenue-year').textContent  = `${formatMoney(s.revenue_year)} cette année`;

    // Chart CA mensuel
    const months = s.revenue_by_month.map(r => {
      const [y, m] = r.month.split('-');
      return new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' });
    });
    new Chart(document.getElementById('chart-revenue'), {
      type: 'bar',
      data: {
        labels: months,
        datasets: [{
          label: 'CA TTC (€)',
          data: s.revenue_by_month.map(r => r.total / 100),
          backgroundColor: 'rgba(13,110,253,0.15)',
          borderColor: 'rgba(13,110,253,0.8)',
          borderWidth: 2,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { callback: v => v.toLocaleString('fr-FR') + ' €' }
          }
        }
      }
    });

    // Chart statuts factures
    const statusLabels = { draft: 'Brouillon', sent: 'Envoyée', paid: 'Payée', cancelled: 'Annulée' };
    const statusColors = { draft: '#adb5bd', sent: '#fd7e14', paid: '#198754', cancelled: '#dc3545' };
    const statusKeys = Object.keys(s.invoice_status);
    new Chart(document.getElementById('chart-status'), {
      type: 'doughnut',
      data: {
        labels: statusKeys.map(k => statusLabels[k] ?? k),
        datasets: [{
          data: statusKeys.map(k => s.invoice_status[k]),
          backgroundColor: statusKeys.map(k => statusColors[k] ?? '#6c757d'),
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom' },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} facture${ctx.raw > 1 ? 's' : ''}` } }
        }
      }
    });

    const tbody = document.getElementById('recent-table');
    if (!s.recent.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Aucun document</td></tr>';
      return;
    }
    tbody.innerHTML = s.recent.map(d => `
      <tr style="cursor:pointer" onclick="window.location='document-editor.html?id=${d.id}'">
        <td class="ps-3 fw-mono">${esc(d.number)}</td>
        <td>${d.type === 'invoice' ? '<span class="badge bg-secondary">Facture</span>' : '<span class="badge bg-info text-dark">Devis</span>'}</td>
        <td>${esc(clientName(d))}</td>
        <td>${formatDate(d.issue_date)}</td>
        <td class="text-end pe-3">${formatMoney(d.total_ttc)}</td>
        <td>${statusBadge(d.type, d.status)}</td>
      </tr>
    `).join('');
  }).catch(() => {
    document.getElementById('recent-table').innerHTML =
      '<tr><td colspan="6" class="text-center text-danger py-4">Erreur de chargement</td></tr>';
  });
</script>

</body>
</html>
