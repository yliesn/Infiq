<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Infiq</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .login-logo {
      max-height: 52px;
      width: auto;
    }
    .input-group-text {
      background-color: #f8f9fa;
    }
    .input-group .form-control:focus {
      box-shadow: none;
      border-color: #86b7fe;
    }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .btn-outline-secondary {
      border-color: #86b7fe;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <!-- Branding -->
  <div class="text-center mb-4">
    <!-- <img src="front/img/logo.png" alt="Infiq" class="login-logo mb-3"> -->
      <svg width="380" height="80" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="72" font-family="Inter, Arial, sans-serif" font-size="34" fill="#3B82F6">
          &lt;/&gt;
        </text>
        <text x="85" y="72" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="600" fill="#111111">
          INFIO
        </text>
        <rect x="88" y="82" width="140" height="4" rx="2" fill="#3B82F6"/>
        <circle cx="240" cy="84" r="3.5" fill="#3B82F6"/>
      </svg>
    <h5 class="fw-bold mb-1">Bienvenue</h5>
    <p class="text-muted small mb-0">Connectez-vous à votre espace Infiq</p>
  </div>

  <!-- Card -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">

      <div id="alert" class="alert d-none" role="alert"></div>

      <div class="mb-3">
        <label for="email" class="form-label fw-medium small">Adresse e-mail</label>
        <div class="input-group">
          <span class="input-group-text border-end-0">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input type="email" id="email" class="form-control border-start-0 ps-1"
                 placeholder="vous@exemple.fr" autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-medium small">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-1"
                 placeholder="••••••••" autocomplete="current-password">
          <button class="btn btn-outline-secondary border-start-0" type="button"
                  id="toggle-pwd" tabindex="-1" title="Afficher / masquer">
            <i class="bi bi-eye" id="toggle-icon"></i>
          </button>
        </div>
      </div>

      <button id="btn-login" class="btn btn-primary w-100 fw-medium">
        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
      </button>

    </div>
  </div>

  <p class="text-center text-muted small mt-3 mb-0">Infiq &mdash; Gestion Infio</p>

</div>

<script>
  const API = 'api';

  if (localStorage.getItem('jwt')) window.location = 'front/dashboard.html';

  document.getElementById('toggle-pwd').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon  = document.getElementById('toggle-icon');
    if (input.type === 'password') {
      input.type      = 'text';
      icon.className  = 'bi bi-eye-slash';
    } else {
      input.type      = 'password';
      icon.className  = 'bi bi-eye';
    }
  });

  document.getElementById('btn-login').addEventListener('click', login);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('email').addEventListener('keydown',    e => { if (e.key === 'Enter') login(); });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');

    if (!email || !password) {
      showAlert('Veuillez remplir tous les champs.', 'warning');
      return;
    }

    btn.disabled    = true;
    btn.innerHTML   = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Connexion…';

    try {
      const res  = await fetch(`${API}/login.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert(data.error || 'Identifiants incorrects.', 'danger');
        return;
      }

      localStorage.setItem('jwt', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location = 'front/dashboard.html';

    } catch (e) {
      showAlert('Impossible de contacter le serveur.', 'danger');
    } finally {
      btn.disabled  = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Se connecter';
    }
  }

  function showAlert(msg, type) {
    const icons = { warning: 'bi-exclamation-triangle-fill', danger: 'bi-x-circle-fill', success: 'bi-check-circle-fill' };
    const el    = document.getElementById('alert');
    el.className  = `alert alert-${type} d-flex align-items-center gap-2 py-2`;
    el.innerHTML  = `<i class="bi ${icons[type] ?? 'bi-info-circle-fill'} flex-shrink-0"></i><span>${esc(msg)}</span>`;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
